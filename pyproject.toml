[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcanon"
# Canonical release version; development checkout identity is derived from Git at runtime.
version = "0.10.0"
description = "Deterministic compiler for composable ContextCanon project context"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
contextcanon = "contextcanon.entry:main"

[tool.setuptools.packages.find]
where = ["src"]
