[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcanon"
version = "0.5.0"
description = "Deterministic compiler for composable ContextCanon project context"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contextcanon = "contextcanon.entry:main"

[tool.setuptools.packages.find]
where = ["src"]
