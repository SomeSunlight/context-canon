# GENERATED ContextCanon machine state for the public Standard node.
# Humans normally read CONTEXT.src.md (local source) or CONTEXT.md (official entry) instead.

schema: contextcanon-poc/v1

# Stable node identity. Name/path may change without changing this ID after publication.
node:
  id: 4ca9d92c-59f2-4b1f-b7b3-0e2ff91fd001
  name: ContextCanon Standard
  version: 0.1.0-draft

# This is a root reusable node: it currently composes no other ContextCanon sources.
sources: []

# Elements authored directly in CONTEXT.src.md.
local:
  rules:
    - {id: CC-001, title: One official package, group: Canonical context}
    - {id: CC-002, title: Edit source, not generated views, group: Canonical context}
    - {id: CC-003, title: Keep compiler bookkeeping out of the normal workflow, group: Machine state}
    - {id: CC-004, title: No implicit source precedence, group: Composition}
    - {id: CC-005, title: Stable identity, group: Identity}
    - {id: CC-006, title: Publish IDs that children may reference, group: Identity}
    - {id: CC-007, title: Keep entry context small, group: Progressive disclosure}
    - {id: CC-008, title: State stays local, group: Project state}
    - {id: CC-009, title: Canonical context is model- and harness-neutral, group: Harness independence}
    - {id: CC-010, title: Keep standard repository documents explicit, group: Repository conventions}
  changes: []
  topics:
    - CC-TOPIC-AUTHORING
    - CC-TOPIC-COMPOSITION
    - CC-TOPIC-HARNESSES

# The normalized official package contains the same identities plus materialized Topic resources.
official:
  rule_ids: [CC-001, CC-002, CC-003, CC-004, CC-005, CC-006, CC-007, CC-008, CC-009, CC-010]
  topic_ids: [CC-TOPIC-AUTHORING, CC-TOPIC-COMPOSITION, CC-TOPIC-HARNESSES]

# All current elements originate in this node; later compilers record full event provenance here.
provenance:
  note: All current rules and topics are defined locally by ContextCanon Standard.

# Exact immutable package/revision data is intentionally not implemented in this documentation POC.
package:
  revision: POC-UNPINNED
  effective_digest: POC-NOT-CALCULATED
  package_digest: POC-NOT-CALCULATED
