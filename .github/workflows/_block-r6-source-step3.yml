name: Complete R6 Source update loop

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply R6 step 3
        run: |
          python tools/_block_r6_source_step3.py
          python -m compileall -q src tests
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused normal Source update loop tests
        run: |
          python -m unittest tests.test_source_update_loop tests.test_git_transport tests.test_source_acceptance tests.test_external_sources tests.test_parent_chain -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify self-hosted context
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Checkpoint completed Block R and commit clean product tree
        run: |
          python tools/_block_r6_source_step3.py --complete
          rm -f .github/workflows/_block-r6-source-step3.yml tools/_block_r6_source_step3.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete safe reusable Source update loop"
          git push origin HEAD:agent/onboarding-placement-publication
