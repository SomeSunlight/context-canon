name: Issue 27 PLAN checkpoint

on:
  push:
    branches:
      - agent/issues-14-15-multi-parent

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.event.head_commit.message == 'Start Issue #27 PLAN checkpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/issue27_plan_checkpoint.py
