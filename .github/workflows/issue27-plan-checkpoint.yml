name: Issue 27 PLAN checkpoint

on:
  pull_request:

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.event.pull_request.head.ref == 'agent/issues-14-15-multi-parent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/issue27_plan_checkpoint.py
