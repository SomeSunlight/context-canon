name: Validate R5 legacy Parent migration

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply R5 step 5
        run: |
          python tools/_block_r5_parent_step5.py
          python tools/_fix_r5_step5_fixture.py
          python -m compileall -q src tests
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused Parent migration and recovery tests
        run: |
          python -m unittest tests.test_parent_migration tests.test_onboarding_placement_publish tests.test_onboarding_reset tests.test_parent_chain tests.test_parent_acceptance tests.test_parent_relationship -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify self-hosted context
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Checkpoint completed R5 and commit clean product tree
        run: |
          python tools/_block_r5_parent_step5.py --complete
          rm -f .github/workflows/_block-r5-parent-step5.yml tools/_block_r5_parent_step5.py tools/_fix_r5_step5_fixture.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate legacy placements to semantic Parents safely"
          git push origin HEAD:agent/onboarding-placement-publication
