name: temporary owner-test followups 32-34

on:
  push:
    branches:
      - fix/issue-30-fresh-onboarding-root

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-30-fresh-onboarding-root
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Issues 32-34
        shell: bash
        run: |
          sed -i 's/pattern.subn(replacement, text, count=1)/pattern.subn(lambda _: replacement, text, count=1)/' .github/tmp_apply_issues_32_34.py
          python .github/tmp_apply_issues_32_34.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused owner-test regressions
        run: python -m unittest tests.test_onboarding_workspace_checkpoint tests.test_onboarding_reusable_contexts tests.test_onboarding_walkthrough_current -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Verify generated output and diff hygiene
        shell: bash
        run: |
          contextcanon check --all .
          git diff --check
      - name: Commit clean product tree
        shell: bash
        run: |
          git config user.name 'ContextCanon automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/tmp-owner-test-followups-32-34.yml .github/tmp_apply_issues_32_34.py
          git add -A
          git commit -m 'Harden live onboarding owner-test follow-ups (#32 #33 #34)'
          git push origin HEAD:fix/issue-30-fresh-onboarding-root
