name: temp-resource-selfhost

on:
  push:
    branches:
      - agent/resource-identity-v2
    paths:
      - .github/workflows/temp-resource-selfhost.yml

permissions:
  contents: write

jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Register legacy direct Resources
        run: contextcanon resource register .
      - name: Show registered Resources
        run: contextcanon resource list .
      - name: Build self-hosted packages
        run: contextcanon build --all .
      - name: Resource status after build
        run: contextcanon resource status .
      - name: Run deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Verify generated state
        run: contextcanon check --all .
      - name: Commit self-hosted migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No self-hosted changes."
          else
            git commit -m "Migrate self-hosted Resources to stable identity"
            git push
          fi

# retrigger final self-host regeneration
