name: Block T final publication readability

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Block T product changes
        shell: bash
        run: |
          python tools/_block_t_apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_parent_relationship.py")
          text = path.read_text(encoding="utf-8")
          old = 'self.assertIn("**Parent:** Shared Parent", compiled.official_markdown)'
          new = 'self.assertIn("**Parent Context Node:** [Shared Parent]", compiled.official_markdown)'
          if text.count(old) != 1:
              raise SystemExit("legacy Parent rendering assertion not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused publication readability tests
        run: python -m unittest -v tests.test_publication_readability tests.test_parent_chain tests.test_parent_relationship tests.test_package tests.test_authoring
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted ContextCanon output
        run: contextcanon build --all .
      - name: Verify exact generated output
        run: contextcanon check --all .
      - name: Diff hygiene
        run: git diff --check
      - name: Remove temporary finalizer
        run: |
          rm -f tools/_block_t_apply.py .github/workflows/_block-t-finalize.yml
          rmdir tools 2>/dev/null || true
      - name: Verify cleanup and generated state
        run: |
          contextcanon check --all .
          git diff --check
          test ! -e tools/_block_t_apply.py
          test ! -e .github/workflows/_block-t-finalize.yml
      - name: Commit clean product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Polish final Context publication readability"
          git push origin HEAD:agent/onboarding-placement-publication
