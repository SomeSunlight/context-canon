name: finalize inventory fast-run

on:
  push:
    branches:
      - agent/onboarding-inventory

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-inventory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Full deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted Context
        run: contextcanon build --all .
      - name: Verify regenerated Context
        run: contextcanon check --all .
      - name: Diff hygiene
        run: git diff --check
      - name: Publish clean product commit and remove finalizer
        shell: bash
        run: |
          rm .github/workflows/finalize-inventory-fast-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 1
          fi
          git commit -m "Regenerate ContextCanon outputs for reviewed inventory (#53)"
          git push origin HEAD:agent/onboarding-inventory
