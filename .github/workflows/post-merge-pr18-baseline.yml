name: Reconcile PR 18 baseline

on:
  push:
    branches:
      - agent/post-merge-pr18-baseline

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-merge-pr18-baseline
          fetch-depth: 0
      - name: Wait for explicit trigger
        id: trigger
        shell: bash
        run: |
          if [[ -f .post-merge-pr18-baseline-trigger ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.trigger.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Apply bounded documentation reconciliation
        if: steps.trigger.outputs.run == 'true'
        run: python .github/scripts/reconcile_pr18_baseline.py
      - name: Install ContextCanon
        if: steps.trigger.outputs.run == 'true'
        run: python -m pip install -e .
      - name: Verify
        if: steps.trigger.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests -v
          contextcanon check --all .
          git diff --check
      - name: Commit clean reconciliation
        if: steps.trigger.outputs.run == 'true'
        shell: bash
        run: |
          rm .github/scripts/reconcile_pr18_baseline.py
          rm .github/workflows/post-merge-pr18-baseline.yml
          rm .post-merge-pr18-baseline-trigger
          git config user.name "ContextCanon automation"
          git config user.email "actions@users.noreply.github.com"
          git add PLAN.md STATE.md README.md .github .post-merge-pr18-baseline-trigger
          git commit -m "Reconcile accepted baseline after PR #18 merge (#28)"
          git push origin HEAD:agent/post-merge-pr18-baseline
