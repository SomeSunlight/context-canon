name: fast-run-block-d1

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-block-d1.yml

permissions:
  contents: write

jobs:
  block-d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - name: Apply resumable workspace block
        run: python tools/_fast_run_block_d1.py
      - name: Run focused tests
        id: tests
        shell: bash
        run: |
          printf 'Block D1 diagnostic for %s\n' "$GITHUB_SHA" > block-d1-diagnostic.txt
          set +e
          python -m unittest \
            tests.test_onboarding_workspace_checkpoint \
            tests.test_onboarding_structure \
            tests.test_onboarding_structure_materialize \
            tests.test_onboarding_placement \
            tests.test_onboarding_placement_review \
            tests.test_onboarding_placement_publish >> block-d1-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat block-d1-diagnostic.txt
          exit 0
      - name: Commit diagnostic on failure
        if: steps.tests.outputs.exit_code != '0'
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add block-d1-diagnostic.txt
          git commit -m "Record Block D1 test diagnostic"
          git push origin HEAD:agent/onboarding-placement-publication
      - name: Remove temporary helpers
        if: steps.tests.outputs.exit_code == '0'
        run: rm -f tools/_fast_run_block_d1.py block-d1-diagnostic.txt .github/workflows/_fast-run-block-d1.yml
      - name: Commit Block D1
        if: steps.tests.outputs.exit_code == '0'
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add -A
          git commit -m "Make onboarding workspace resumable"
          git push origin HEAD:agent/onboarding-placement-publication
