name: Temporary owner UX hardening

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
          fetch-depth: 0

      - name: Apply owner-testing UX hardening
        run: python tools/_apply_owner_ux_hardening.py

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Run complete regression suite
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify generated ContextCanon state
        run: PYTHONPATH=src python -m contextcanon check --all .

      - name: Commit clean product result
        run: |
          rm -f tools/_apply_owner_ux_hardening.py .github/workflows/_owner-ux-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden onboarding operator UX and reset"
          git push origin HEAD:agent/onboarding-placement-publication
