name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Unit and repository consistency tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated ContextCanon output
        shell: bash
        run: |
          if ! contextcanon check --all .; then
            echo "::group::Generated drift diff"
            contextcanon build --all .
            # Include newly generated files in the diagnostic diff without
            # staging their contents in the repository.
            git add -N .
            git diff
            echo "::endgroup::"
            exit 1
          fi
      - name: Upload generated drift snapshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-drift
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1
          path: |
            .context/
            CONTEXT.md
            CONTEXT/
            AGENTS.md
            .goosehints
            nodes/**/.context/
            nodes/**/CONTEXT.md
            nodes/**/CONTEXT/
            nodes/**/AGENTS.md
            nodes/**/.goosehints
