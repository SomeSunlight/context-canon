name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Unit and repository consistency tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated ContextCanon output
        shell: bash
        run: |
          if ! contextcanon check --all .; then
            echo "::group::Generated drift diff"
            contextcanon build --all .
            git diff
            echo "::endgroup::"
            exit 1
          fi
