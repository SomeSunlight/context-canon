name: finalize issue 24 legacy migration

# Keep workflow YAML orchestration-only; implementation logic lives in Python helpers.
on:
  push:
    branches:
      - agent/issues-14-15-multi-parent
    paths:
      - .github/workflows/finalize-issue-24-legacy-migration.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair prepared Python builder
        run: python .contextcanon-fix-issue24-builder.py
      - name: Apply Issue 24 migration completion
        run: python .contextcanon-issue24-legacy-migration.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Python syntax gate
        run: python -m compileall -q src tests
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted Context
        run: contextcanon build --all .
      - name: Verify generated Context
        run: contextcanon check --all .
      - name: Commit clean candidate
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && rm -f .contextcanon-fix-issue24-builder.py .contextcanon-issue24-legacy-migration.py .github/workflows/finalize-issue-24-legacy-migration.yml && git add -A && git diff --cached --check && git commit -m "Complete legacy Source discovery migration (#24)" && git push origin HEAD:agent/issues-14-15-multi-parent
