name: provider generated outputs

on:
  push:
    branches:
      - agent/development-workflow-providers

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Build provider packages
        run: contextcanon build --all .
      - name: Commit provider generated outputs
        shell: bash
        run: |
          git add nodes/library/github nodes/library/github-local
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate workflow provider packages"
          git push
