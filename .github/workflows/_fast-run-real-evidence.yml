name: fast-run-real-evidence

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-real-evidence.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current ContextCanon
        run: python -m pip install -e .
      - name: Reconstruct the real frozen AI Workstation Evidence
        shell: bash
        run: |
          git clone -q https://github.com/SomeSunlight/ai-workstation.git /tmp/ai-workstation
          git -C /tmp/ai-workstation checkout -q 4106fec3f7726d6c9bfedd70d30d9ed025b7c166
          contextcanon onboard prepare /tmp/ai-workstation
          test -f /tmp/ai-workstation/.context/onboarding/2a926bf353b252db4039e5c4b63b39abad6bab46c11982e88b3eb17e19cf203d/manifest.json
          echo "Exact frozen Evidence digest reproduced from ai-workstation@4106fec3f7726d6c9bfedd70d30d9ed025b7c166"
      - name: Regenerate current self-hosted packages
        run: contextcanon build --all .
      - name: Report Development Workflow package identity
        run: python -c "from pathlib import Path; from contextcanon.package import load_package; p=load_package(Path('nodes/library/development-workflow')); print('node_id='+p.metadata.id); print('version='+p.metadata.version); print('normalized_digest='+p.normalized_digest); print('package_digest='+p.package_digest)"
      - name: Remove temporary workflow
        run: rm .github/workflows/_fast-run-real-evidence.yml
      - name: Commit regenerated packages
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate onboarding review packages"
          git push origin HEAD:agent/onboarding-placement-publication
