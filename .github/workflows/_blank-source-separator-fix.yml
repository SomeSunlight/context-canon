name: Temporary blank Source separator validation fix

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow validation correction
        run: python tools/_blank_source_separator_fix.py apply
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused regression
        run: python -m unittest tests.test_onboarding_placement.OnboardingPlacementTests.test_source_edit_coverage_ignores_only_blank_separator_lines -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate ContextCanon outputs
        run: contextcanon build --all .
      - name: Verify generated output
        run: contextcanon check --all .
      - name: Verify implementation diff
        run: git diff --check
      - name: Finalize durable checkpoint
        run: python tools/_blank_source_separator_fix.py finalize
      - name: Rebuild and recheck after checkpoint
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Remove temporary harness and commit clean product result
        run: |
          rm -f tools/_blank_source_separator_fix.py .github/workflows/_blank-source-separator-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Allow blank separators in placement source edits"
          git push origin HEAD:agent/onboarding-placement-publication
