name: issue-99-self-host-refresh

on:
  push:
    branches:
      - issue-99-parent-reference-phase1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-99-parent-reference-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Run complete deterministic suite before mutation
        run: python -m unittest discover -s tests -v
      - name: Normalize legacy relationships
        run: contextcanon source normalize --all .
      - name: Rebuild provider Nodes first
        shell: bash
        run: |
          contextcanon build nodes/library/foundation
          contextcanon build nodes/library/development-workflow
      - name: Advance Framework's explicit local Foundation version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          provider = Path("nodes/library/foundation/CONTEXT.src.md").read_text(encoding="utf-8")
          match = re.search(r'ctx:node\s+[^>]*version="([^"]+)"', provider)
          if match is None:
              raise SystemExit("Foundation version not found")
          version = match.group(1)

          path = Path("nodes/internal/framework-development/CONTEXT.src.md")
          text = path.read_text(encoding="utf-8")
          source_line = re.compile(
              r'(- \[ContextCanon Foundation\]\([^\n]+\) — `)[^\`]+(` — `relationship=parent`)'
          )
          source_comment = re.compile(
              r'(ctx:source\s+id="4ca9d92c-59f2-4b1f-b7b3-0e2ff91fd001"\s+version=")[^"]+(")'
          )
          text, visible_count = source_line.subn(rf'\g<1>{version}\g<2>', text, count=1)
          text, comment_count = source_comment.subn(rf'\g<1>{version}\g<2>', text, count=1)
          if visible_count != 1 or comment_count != 1:
              raise SystemExit("Framework Foundation import was not updated exactly once")
          path.write_text(text, encoding="utf-8")
          print(f"Framework Foundation Parent advanced to {version}")
          PY
      - name: Rebuild consumers and root
        shell: bash
        run: |
          contextcanon build nodes/internal/framework-development
          contextcanon build nodes/library/github
          contextcanon build nodes/library/github-local
          contextcanon build .
      - name: Verify zero generated drift
        run: contextcanon check --all .
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit deterministic self-host refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No self-host refresh changes to commit."
            exit 0
          fi
          git commit -m "build: self-host Parent Reference migration (#99)"
          git push origin HEAD:issue-99-parent-reference-phase1
