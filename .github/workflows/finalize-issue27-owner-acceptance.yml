name: Finalize issue 27 owner acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/issues-14-15-multi-parent'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python .github/scripts/finalize_issue27_owner_acceptance.py
      - run: python -m compileall -q src tests
      - run: contextcanon build --all .
      - run: python -m unittest discover -s tests -v
      - run: contextcanon check --all .
      - run: git diff --check
      - name: Commit final owner acceptance state
        run: |
          rm .github/scripts/finalize_issue27_owner_acceptance.py
          rm .github/workflows/finalize-issue27-owner-acceptance.yml
          git config user.name "ContextCanon automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record final Issue 27 owner acceptance"
          git push origin HEAD:agent/issues-14-15-multi-parent
