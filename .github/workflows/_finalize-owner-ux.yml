name: Temporary final owner UX polish

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
          fetch-depth: 0

      - name: Apply final owner UX polish
        run: python tools/_finalize_owner_ux.py

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Run complete regression suite
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'

      - name: Regenerate all ContextCanon outputs
        run: PYTHONPATH=src python -m contextcanon build --all .

      - name: Verify zero generated drift
        run: PYTHONPATH=src python -m contextcanon check --all .

      - name: Verify clean diff
        run: git diff --check

      - name: Commit clean product result
        run: |
          rm -f tools/_finalize_owner_ux.py .github/workflows/_finalize-owner-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize onboarding operator runbook UX"
          git push origin HEAD:agent/onboarding-placement-publication
