name: finalize source canonical-name UX

on:
  push:
    branches:
      - agent/issues-14-15-multi-parent
    paths:
      - .github/workflows/finalize-source-name-ux.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkpoint PLAN
        run: python .contextcanon-fix-source-name-ux.py plan && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add PLAN.md && git diff --cached --check && git commit -m "Checkpoint Source canonical-name UX correction (#22)"
      - name: Apply product correction
        run: python .contextcanon-fix-source-name-ux.py product
      - name: Preserve Parent regex compatibility
        run: python .contextcanon-fix-source-regex-compat.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Python syntax gate
        run: python -m compileall -q src tests
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted Context
        run: contextcanon build --all .
      - name: Verify generated Context
        run: contextcanon check --all .
      - name: Commit clean candidate
        run: rm -f .contextcanon-fix-source-name-ux.py .contextcanon-fix-source-regex-compat.py .github/workflows/finalize-source-name-ux.yml && git add -A && git diff --cached --check && git commit -m "Use accepted Source names in human update UX (#22)" && git push origin HEAD:agent/issues-14-15-multi-parent
