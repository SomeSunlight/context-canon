name: Implement Block R2 normal authoring

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Block R2
        run: |
          python tools/_block_r2_authoring.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_authoring.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('target.path) for target in topic.targets]', 'target.locator) for target in topic.targets]')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused authoring tests
        run: python -m unittest tests.test_authoring -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify self-hosted context
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Checkpoint completed R2 and commit clean product tree
        shell: bash
        run: |
          python tools/_block_r2_authoring.py --complete
          rm -f .github/workflows/_block-r2-authoring.yml tools/_block_r2_authoring.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add normal Rule and Topic authoring commands"
          git push origin HEAD:agent/onboarding-placement-publication
