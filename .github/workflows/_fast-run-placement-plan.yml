name: fast-run-placement-plan

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-placement-plan.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - name: Apply checkpoint
        run: python tools/_fast_run_placement_plan.py
      - name: Remove temporary helpers
        run: rm tools/_fast_run_placement_plan.py .github/workflows/_fast-run-placement-plan.yml
      - name: Commit checkpoint
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add PLAN.md nodes/library/development-workflow/CONTEXT.src.md nodes/library/development-workflow/docs/change-workflow.md tools/_fast_run_placement_plan.py .github/workflows/_fast-run-placement-plan.yml
          git commit -m "Plan placement ownership fast-run"
          git push origin HEAD:agent/onboarding-placement-publication
