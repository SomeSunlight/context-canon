name: finalize issues 14-17 review checkpoint

on:
  push:
    branches:
      - agent/issues-14-15-multi-parent

permissions:
  contents: write

concurrency:
  group: finalize-issues-14-17
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Close verified PLAN block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('PLAN.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'Add the Development Workflow rule that implementation, framework-context, and substantial documentation changes must be backed by an Issue; the Issue may be brief.',
              'Resolve #14 with a short Foundation layout rule and a small onboarding-structure bias: existing directories are the default when they fit; Node roots and primarily governed files should normally be colocated; unusual separation is a human-review flag, never implicit inheritance.',
              'Resolve #15 with a short Development Workflow rule: inherited/applicable Context constrains a task but does not silently expand its writable change scope.',
              'Restore #17 consistently: a Node may have several semantic Parents; Parent order has no precedence; exact package pinning/review remains per Parent; deterministic same-identity conflicts remain errors.',
              'Add the multi-Parent invariant to Foundation, including the warning that non-orthogonal Parent context can create semantic contradictions that users must currently resolve explicitly.',
              'Record future LLM-assisted contradiction detection as later work only; it may flag likely semantic conflicts but must not choose precedence automatically.',
              'Add focused multi-Parent/layout/workflow regressions, regenerate affected self-hosted Context packages, run the complete suite plus build/check/diff hygiene, and prepare a review PR. Do not merge without explicit project-owner approval.',
          ]
          for item in items:
              old = f'- [ ] {item}'
              new = f'- [x] {item}'
              if text.count(old) != 1:
                  raise SystemExit(f'PLAN item anchor mismatch: {item}')
              text = text.replace(old, new, 1)
          checkpoint = 'Checkpoint: Issues #14–#17 are implemented in draft PR #18. Multi-Parent composition is order-independent, onboarding intentionally remains a single primary navigation hierarchy, legacy `package/v0` remains readable beside plural `package/v1`, and the exact product candidate passed 226 deterministic tests, self-build, zero-drift `check --all`, and diff hygiene. PR #18 remains unmerged pending explicit project-owner approval.'
          if checkpoint not in text:
              marker = '\n### Later semantic contradiction audit\n'
              if text.count(marker) != 1:
                  raise SystemExit('Later semantic audit anchor mismatch')
              text = text.replace(marker, f'\n{checkpoint}\n{marker}', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Python syntax gate
        run: python -m compileall -q src tests
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted Context
        run: contextcanon build --all .
      - name: Verify generated Context
        run: contextcanon check --all .
      - name: Remove finalizer
        run: rm -f .github/workflows/finalize-issues-14-17.yml
      - name: Diff hygiene
        run: git diff --check
      - name: Commit exact review candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Checkpoint issues 14-17 review candidate (#14 #15 #16 #17)"
          git push origin HEAD:${GITHUB_REF_NAME}
