# Temporary branch-only regeneration of self-hosted Context packages for issue #130.
# This never targets main and is removed after the generated output is committed.
name: selfhost-regenerate-issue-130
on:
  push:
    branches:
      - agent/130-version-check

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/agent/130-version-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local compiler
        run: python -m pip install -e .
      - name: Restore one verified historical package byte mismatch (issue 133)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256

          suffix = "CONTEXT/references/nd268d581199b5a7/nodes/internal/framework-development/docs/state.md"
          target = Path(".context/versions/3a9bfcf032abfdfa") / suffix
          donor = Path(".context/versions/14d5814ed7d4113d") / suffix
          expected = "2725beca19e2eb26d29af2d8a8078415fc518943ac14b0d4bb7743024b5024ae"
          known_bad = "d5eee4e08818b59a186ad90cf92bbf06ea2eebb7f126a1ad45cbe890f4b6b508"
          verified = donor.read_bytes()
          existing = target.read_bytes()
          assert len(verified) == 1382 and sha256(verified).hexdigest() == expected
          if sha256(existing).hexdigest() == known_bad and len(existing) == 1383:
              target.write_bytes(verified)
              print("Restored the one byte-corrupt retained resource from verified matching bytes.")
          else:
              assert existing == verified, "Unexpected historical package bytes; refusing repair"
          PY
      - name: Rebuild and accept local self-hosted normative parents
        shell: bash
        run: |
          set -euxo pipefail
          contextcanon build nodes/library/development-workflow
          # In-repository Source carriers intentionally bind only a local Node
          # version (not immutable package digests). Author its new accepted
          # version in Markdown before the compiler can load that live Parent.
          python - <<'PY'
          from pathlib import Path
          paths = (
              Path("nodes/internal/framework-development/CONTEXT.src.md"),
              Path("nodes/library/github/CONTEXT.src.md"),
              Path("nodes/library/github-local/CONTEXT.src.md"),
          )
          for path in paths:
              original = path.read_text(encoding="utf-8")
              assert original.count("0.3.8-draft") == 2, f"Unexpected Source pin layout: {path}"
              updated = original.replace("0.3.8-draft", "0.3.9-draft")
              path.write_text(updated, encoding="utf-8")
              print(f"Authored new local Development Workflow version in {path}")
          PY
          contextcanon build --all .
          contextcanon propagate --all . --yes
          contextcanon check --all .
      - name: Commit generated and accepted state only to the review branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate accepted ContextCanon packages for #130"
            git push origin HEAD:refs/heads/agent/130-version-check
          fi
