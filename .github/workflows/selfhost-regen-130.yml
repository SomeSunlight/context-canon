# Temporary branch-only regeneration of self-hosted Context packages for issue #130.
# This never targets main and is removed after the generated output is committed.
name: selfhost-regenerate-issue-130
on:
  push:
    branches:
      - agent/130-version-check

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/agent/130-version-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local compiler
        run: python -m pip install -e .
      - name: Rebuild and accept local self-hosted normative parents
        shell: bash
        run: |
          set -euxo pipefail
          contextcanon build --all .
          contextcanon propagate --all . --yes
          contextcanon build --all .
          contextcanon check --all .
      - name: Commit generated and accepted state only to the review branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate accepted ContextCanon packages for #130"
            git push origin HEAD:refs/heads/agent/130-version-check
          fi
