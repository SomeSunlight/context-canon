name: Temporary placement summary review hardening

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record development block
        run: python tools/_placement_summary_review_fix.py plan
      - name: Apply placement summary and cockpit corrections
        run: python tools/_placement_summary_review_fix.py apply
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused placement regressions
        run: |
          python -m unittest tests.test_onboarding_placement -v
          python -m unittest tests.test_onboarding_placement_review -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate ContextCanon outputs
        run: contextcanon build --all .
      - name: Verify zero generated drift
        run: contextcanon check --all .
      - name: Verify implementation diff
        run: git diff --check
      - name: Finalize durable PLAN and STATE
        run: python tools/_placement_summary_review_fix.py finalize
      - name: Recheck after durable checkpoint
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Remove temporary harness and commit clean product result
        run: |
          rm -f tools/_placement_summary_review_fix.py .github/workflows/_placement-summary-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden placement summaries and review overrides"
          git push origin HEAD:agent/onboarding-placement-publication
