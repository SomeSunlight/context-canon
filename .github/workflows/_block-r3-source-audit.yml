name: Implement Block R3 source transformation audit

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Block R3
        run: |
          python tools/_fix_block_r3_harness.py
          python tools/_block_r3_source_audit.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused source-audit tests
        run: python -m unittest tests.test_onboarding_placement_audit tests.test_onboarding_placement_review tests.test_onboarding_reset -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify self-hosted context
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Checkpoint completed R3 and commit clean product tree
        shell: bash
        run: |
          python tools/_block_r3_source_audit.py --complete
          rm -f .github/workflows/_block-r3-source-audit.yml tools/_block_r3_source_audit.py tools/_fix_block_r3_harness.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add source-first onboarding transformation audit"
          git push origin HEAD:agent/onboarding-placement-publication
