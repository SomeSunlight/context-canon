name: temporary Issue 35 apply and verify

on:
  push:
    branches:
      - fix/issue-30-fresh-onboarding-root

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-30-fresh-onboarding-root
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Issue 35
        run: python .github/tmp_issue35_apply.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused split-review regressions
        run: python -m unittest tests.test_onboarding_placement_review tests.test_onboarding_placement_publish tests.test_onboarding_reset -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Verify generated output and diff hygiene
        shell: bash
        run: |
          contextcanon check --all .
          git diff --check
      - name: Commit clean product tree
        shell: bash
        run: |
          git config user.name 'ContextCanon automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/tmp_issue35_apply.py .github/workflows/tmp-issue35-apply.yml
          git add -A
          git diff --cached --check
          git commit -m 'Split STEP-08 placement review into finding files (#35)'
          git push origin HEAD:fix/issue-30-fresh-onboarding-root
