name: Block U reusable Context onboarding UX

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply product changes
        run: |
          python tools/_block_u_apply.py
          python tools/_block_u_followup.py
      - name: Install
        run: python -m pip install -e .
      - name: Focused tests
        run: python -m unittest -v tests.test_onboarding_reusable_contexts tests.test_onboarding_plan_steps tests.test_onboarding_reset tests.test_onboarding_placement tests.test_onboarding_placement_publish tests.test_onboarding_placement_review tests.test_parent_chain tests.test_package
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Build all
        run: contextcanon build --all .
      - name: Check all
        run: contextcanon check --all .
      - name: Diff hygiene
        run: git diff --check
      - name: Remove temporary files
        run: |
          rm -f tools/_block_u_apply.py tools/_block_u_followup.py .github/workflows/_block-u-finalize.yml
          rmdir tools 2>/dev/null || true
      - name: Check after cleanup
        run: |
          contextcanon check --all .
          git diff --check
      - name: Commit product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SomeSunlight@users.noreply.github.com"
          git add -A
          git commit -m "Make reusable Context onboarding human-first"
          git push origin HEAD:agent/onboarding-placement-publication
