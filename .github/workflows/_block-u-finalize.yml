name: Block U reusable Context onboarding UX

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Block U product changes
        run: python tools/_block_u_apply.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused reusable-context UX tests
        run: >-
          python -m unittest -v
          tests.test_onboarding_reusable_contexts
          tests.test_onboarding_plan_steps
          tests.test_onboarding_workspace
          tests.test_onboarding_reset
          tests.test_onboarding_placement_publish
          tests.test_onboarding_placement_review
          tests.test_parent_chain
          tests.test_package
          tests.test_parser
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Record verified Block U checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          plan = Path('PLAN.md')
          text = plan.read_text(encoding='utf-8')
          text = text.replace(
              '**Status: ACTIVE — implementation under verification; owner acceptance pending.**',
              '**Status: COMPLETE — implementation verified; final owner onboarding acceptance pending.**',
              1,
          )
          text = text.replace(
              '- [ ] 7. Run focused regressions, complete deterministic suite, self-build/check, diff hygiene and cleanup; then hand the exact clean PR head to the project owner for the final real `ai-workstation` onboarding/readability test. PR remains draft/unmerged until explicit owner approval.',
              '- [x] 7. Run focused regressions, complete deterministic suite, self-build/check, diff hygiene and cleanup; then hand the exact clean PR head to the project owner for the final real `ai-workstation` onboarding/readability test. PR remains draft/unmerged until explicit owner approval.',
              1,
          )
          plan.write_text(text, encoding='utf-8')

          state = Path('STATE.md')
          current = state.read_text(encoding='utf-8').rstrip()
          current += '''

## Latest Block U reusable-Context onboarding UX checkpoint

The last operator-memory dependency in structure-first onboarding is removed. Reusable Context composition is now a dedicated human gate after project shelves are materialized and before placement reasoning: `STEP-05-reusable-contexts.md` owns Catalog locations, sparse human-readable assignments and their Why rationale, while ContextCanon resolves exact Source IDs/digests and persists machine state. Normal placement commands no longer require repeated `--catalog-package` or one-time `--owner-source` reconstruction; those CLI options remain only for scripting/backward compatibility.

The visible runbook now keeps each numbered STEP's title, novice-oriented explanation, completion checkbox, exact command and artifact guidance together rather than splitting a checklist from a lower command manual. Downstream artifacts are renumbered through STEP 10 with migration aliases for prior workspace names. Accepted Source relationship Why is published into local Source authoring and carried through immutable import provenance, so deep generated Context can explain both where a reusable Context arrived and why it was attached. PR #13 remains draft/unmerged pending the project owner's final real `ai-workstation` acceptance.
'''
          state.write_text(current + '\n', encoding='utf-8')
          PY
      - name: Regenerate self-hosted ContextCanon output
        run: contextcanon build --all .
      - name: Verify exact generated output
        run: contextcanon check --all .
      - name: Diff hygiene
        run: git diff --check
      - name: Remove temporary finalizer
        run: |
          rm -f tools/_block_u_apply.py .github/workflows/_block-u-finalize.yml
          rmdir tools 2>/dev/null || true
      - name: Verify cleanup and generated state
        run: |
          contextcanon check --all .
          git diff --check
          test ! -e tools/_block_u_apply.py
          test ! -e .github/workflows/_block-u-finalize.yml
      - name: Commit clean product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Make reusable Context onboarding human-first"
          git push origin HEAD:agent/onboarding-placement-publication
