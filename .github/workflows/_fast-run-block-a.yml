name: fast-run-block-a

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-block-a.yml

permissions:
  contents: write

jobs:
  block-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - name: Apply Block A
        run: python tools/_fast_run_block_a.py
      - name: Run focused tests
        run: python -m unittest tests.test_onboarding_structure tests.test_onboarding_placement
      - name: Remove temporary helpers
        run: rm tools/_fast_run_block_a.py .github/workflows/_fast-run-block-a.yml
      - name: Commit Block A
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add PLAN.md src/contextcanon/onboarding_structure.py src/contextcanon/onboarding_structure_instruction.py src/contextcanon/onboarding_placement.py src/contextcanon/onboarding_placement_instruction.py tests/test_onboarding_structure.py tests/test_onboarding_placement.py tools/_fast_run_block_a.py .github/workflows/_fast-run-block-a.yml
          git commit -m "Clarify placement ownership semantics"
          git push origin HEAD:agent/onboarding-placement-publication
