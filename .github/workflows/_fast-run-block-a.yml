name: fast-run-block-a

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-block-a.yml

permissions:
  contents: write

jobs:
  block-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - name: Repair staged patch target
        run: python tools/_repair_fast_run_block_a_v2.py
      - name: Apply Block A
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          rm -f block-a-diagnostic.txt
          set +e
          python tools/_fast_run_block_a.py > block-a-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat block-a-diagnostic.txt
          exit 0
      - name: Commit diagnostic when patch fails
        if: steps.apply.outputs.exit_code != '0'
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add block-a-diagnostic.txt
          git commit -m "Record Block A patch diagnostic"
          git push origin HEAD:agent/onboarding-placement-publication
      - name: Run focused tests
        if: steps.apply.outputs.exit_code == '0'
        run: python -m unittest tests.test_onboarding_structure tests.test_onboarding_placement
      - name: Remove temporary helpers
        if: steps.apply.outputs.exit_code == '0'
        run: rm -f tools/_fast_run_block_a.py tools/_repair_fast_run_block_a.py tools/_repair_fast_run_block_a_v2.py block-a-diagnostic.txt .github/workflows/_fast-run-block-a.yml
      - name: Commit Block A
        if: steps.apply.outputs.exit_code == '0'
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add -A
          git commit -m "Clarify placement ownership semantics"
          git push origin HEAD:agent/onboarding-placement-publication
