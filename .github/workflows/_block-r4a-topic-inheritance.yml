name: Implement Block R4a effective Topic inheritance

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Block R4a
        run: python tools/_block_r4a_topic_inheritance.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused Topic inheritance tests
        run: python -m unittest tests.test_walking_skeleton tests.test_package tests.test_external_sources tests.test_diff tests.test_external_sources tests.test_git_transport -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify self-hosted context
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Checkpoint completed R4a and commit clean product tree
        shell: bash
        run: |
          python tools/_block_r4a_topic_inheritance.py --complete
          rm -f .github/workflows/_block-r4a-topic-inheritance.yml tools/_block_r4a_topic_inheritance.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Compose Topics across Source packages"
          git push origin HEAD:agent/onboarding-placement-publication
