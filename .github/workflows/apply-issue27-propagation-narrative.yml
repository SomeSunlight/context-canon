name: Apply issue 27 propagation narrative

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issues-14-15-multi-parent'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python .github/scripts/patch_issue27_propagation_applicator.py
      - run: python .github/scripts/apply_issue27_propagation_narrative.py
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: contextcanon build --all .
      - run: python -m unittest discover -s tests -v
      - run: contextcanon check --all .
      - run: git diff --check
      - name: Commit clean gated product
        run: |
          rm .github/scripts/patch_issue27_propagation_applicator.py
          rm .github/scripts/apply_issue27_propagation_narrative.py
          rm .github/workflows/apply-issue27-propagation-narrative.yml
          git config user.name "ContextCanon automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refine propagation review narrative"
          git push origin HEAD:agent/issues-14-15-multi-parent
