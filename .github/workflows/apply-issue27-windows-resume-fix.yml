name: Apply issue 27 Windows resume fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issues-14-15-multi-parent'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python .github/scripts/apply_issue27_windows_resume_fix.py
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: contextcanon build --all .
      - run: python -m unittest discover -s tests -v
      - run: contextcanon check --all .
      - run: git diff --check
      - name: Commit clean gated product
        run: |
          rm .github/scripts/checkpoint_issue27_windows_resume.py
          rm .github/workflows/checkpoint-issue27-windows-resume.yml
          rm .github/scripts/apply_issue27_windows_resume_fix.py
          rm .github/workflows/apply-issue27-windows-resume-fix.yml
          git config user.name "ContextCanon automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden Windows propagation resume UX"
          git push origin HEAD:agent/issues-14-15-multi-parent

  windows-focused:
    needs: apply
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_source_acceptance.SourceAcceptanceTests.test_package_publish_retries_transient_permission_error tests.test_propagation_review_ux.PropagationReviewUXTests.test_propagation_rerun_skips_already_current_steps_and_resumes_at_stale_child -v
