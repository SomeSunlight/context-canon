name: Issue 27 propagation UX

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issues-14-15-multi-parent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python .github/scripts/issue27_fix_helper.py
      - run: python .github/scripts/issue27_propagation_ux.py
      - run: python -m unittest tests.test_propagation_review_ux
      - run: |
          rm .github/scripts/issue27_fix_helper.py
          rm .github/scripts/issue27_propagation_ux.py
          rm .github/workflows/issue27-propagation-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make propagation a guided downstream review"
          git push origin HEAD:agent/issues-14-15-multi-parent
