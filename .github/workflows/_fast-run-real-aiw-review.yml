name: fast-run-real-aiw-publication

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-real-aiw-review.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current ContextCanon
        run: python -m pip install -e .
      - name: Prepare real harness
        run: |
          python tools/_repair_real_aiw_diagnostic.py
          python tools/_repair_real_aiw_workspace.py
          python tools/_repair_real_aiw_semantics.py
      - name: Run corrected review and publication validation
        id: validate
        shell: bash
        run: |
          printf 'Real AI Workstation publication diagnostic for %s\n' "$GITHUB_SHA" > real-aiw-publication-diagnostic.txt
          set +e
          python tools/_real_aiw_review.py >> real-aiw-publication-diagnostic.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python tools/_real_aiw_publish.py >> real-aiw-publication-diagnostic.txt 2>&1
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat real-aiw-publication-diagnostic.txt
          exit 0
      - name: Commit diagnostic on failure
        if: steps.validate.outputs.exit_code != '0'
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add real-aiw-publication-diagnostic.txt
          git commit -m "Record real AI Workstation publication diagnostic"
          git push origin HEAD:agent/onboarding-placement-publication
      - name: Commit real validation report
        if: steps.validate.outputs.exit_code == '0'
        run: |
          rm -f real-aiw-publication-diagnostic.txt
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add _real-ai-workstation-publication-report.json
          git commit -m "Validate real AI Workstation placement publication"
          git push origin HEAD:agent/onboarding-placement-publication
