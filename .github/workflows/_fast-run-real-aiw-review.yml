name: finalize-placement-publication-candidate

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-real-aiw-review.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Checkpoint real validation
        run: python tools/_finalize_pr13.py
      - name: Remove temporary real-test harness and reports
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/_fast-run-real-aiw-review.yml \
            _real-ai-workstation-placement-review.json \
            _real-ai-workstation-placement-review.md \
            _real-ai-workstation-publication-report.json \
            real-aiw-review-diagnostic.txt \
            real-aiw-publication-diagnostic.txt \
            tools/_real_aiw_publish.py \
            tools/_real_aiw_review.py \
            tools/_repair_real_aiw_diagnostic.py \
            tools/_repair_real_aiw_semantics.py \
            tools/_repair_real_aiw_workspace.py \
            tools/_repair_real_aiw_publish_manifest.py \
            tools/_finalize_pr13.py
      - name: Regenerate self-hosted Context packages
        run: contextcanon build --all .
      - name: Full deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Verify zero generated drift
        run: contextcanon check --all .
      - name: Inspect cleaned review diff
        shell: bash
        run: |
          git diff --check
          git diff --name-only origin/main...HEAD > /tmp/existing-pr-paths.txt
          git diff --name-only > /tmp/finalizer-paths.txt
          cat /tmp/existing-pr-paths.txt
          cat /tmp/finalizer-paths.txt
          if { cat /tmp/existing-pr-paths.txt; cat /tmp/finalizer-paths.txt; } | grep -E '(^|/)(_real-aiw|_real_aiw|_repair_real_aiw|_fast-run-real-aiw|real-aiw-|_finalize_pr13)' ; then
            echo "temporary real-test path remains in review diff" >&2
            exit 1
          fi
      - name: Commit cleaned review candidate
        run: |
          git config user.name "ContextCanon finalizer"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add -A
          git commit -m "Finalize placement publication review candidate"
          git push origin HEAD:agent/onboarding-placement-publication
