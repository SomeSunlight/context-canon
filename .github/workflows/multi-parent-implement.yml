name: issue 14-17 implementation gate

on:
  push:
    branches:
      - agent/issues-14-15-multi-parent

permissions:
  contents: write

concurrency:
  group: issue-14-17-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare temporary helper
        run: |
          python - <<'PY'
          from pathlib import Path
          helper = Path('.github/tmp/apply_multi_parent.py')
          text = helper.read_text(encoding='utf-8')
          text = text.replace("path.write_text(r'''from __future__ import annotations", 'path.write_text(r"""from __future__ import annotations')
          text = text.replace("    unittest.main()\n''', encoding=\"utf-8\")", '    unittest.main()\n""", encoding="utf-8")')
          block_start = text.index('t = exact(\n    t,\n    "    machine_yaml: str = \\\"\\\"')
          block_end = text.index('t = exact(\n    t,\n    "    parents: tuple[PackageDependency, ...] = ()\\n",', block_start)
          text = text[:block_start] + text[block_end:]
          helper.write_text(text, encoding='utf-8')

          model = Path('src/contextcanon/model.py')
          text = model.read_text(encoding='utf-8')
          anchor = '    @property\n    def metadata(self) -> NodeMetadata:\n'
          replacement = (
              '    @property\n'
              '    def parent_package(self) -> CompiledPackage | None:\n'
              '        if len(self.parent_packages) > 1:\n'
              '            raise ValueError("Node has multiple semantic Parents; use .parent_packages")\n'
              '        return self.parent_packages[0] if self.parent_packages else None\n\n'
              + anchor
          )
          if anchor not in text:
              raise SystemExit('CompiledNode metadata anchor missing')
          model.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Apply bounded product patch
        run: python .github/tmp/apply_multi_parent.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Python syntax gate
        run: python -m compileall -q src tests
      - name: Focused multi-parent regressions
        run: python -m unittest tests.test_multi_parent tests.test_parent_relationship tests.test_parent_acceptance tests.test_parent_chain tests.test_onboarding_structure tests.test_onboarding_placement_publish -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted Context
        run: contextcanon build --all .
      - name: Verify generated Context
        run: contextcanon check --all .
      - name: Remove temporary harness
        run: |
          rm -f .github/tmp/apply_multi_parent.py
          rm -f .github/workflows/multi-parent-diagnostic.yml
          rm -f .github/workflows/multi-parent-implement.yml
          rmdir .github/tmp 2>/dev/null || true
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified product tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Resolve layout, change-scope, and multi-parent semantics (#14 #15 #16 #17)"
          git push origin HEAD:${GITHUB_REF_NAME}
