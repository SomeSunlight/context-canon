name: issue-36-finalize

on:
  push:
    branches:
      - fix/issue-30-fresh-onboarding-root

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[issue-36-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-30-fresh-onboarding-root
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply support patches
        run: |
          python .github/issue36_support_patch.py
          python .github/issue36_test_support_patch.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused regressions
        run: python -m unittest tests.test_onboarding_placement_review tests.test_onboarding_placement_audit tests.test_onboarding_reset tests.test_onboarding_workspace_checkpoint -v
      - name: Full deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Verify generated ContextCanon output
        run: contextcanon check --all .
      - name: Verify clean diff
        run: git diff --check
      - name: Finalize PLAN checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PLAN.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '- [ ] Run focused/full deterministic regressions, zero-drift check and clean-diff verification; keep PR #31 draft/unmerged for continued owner validation.',
              '- [x] Run focused/full deterministic regressions, zero-drift check and clean-diff verification; keep PR #31 draft/unmerged for continued owner validation.'
          )
          text = text.replace(
              'Verification is still pending on the final product tree; PR #31 remains draft and unmerged.',
              'The final Issue #36 product tree passed the focused regressions, complete deterministic suite, `contextcanon check --all .`, and `git diff --check`. PR #31 remains draft and unmerged pending continued `Llama_Dispatcher` owner validation.'
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit clean product tree
        shell: bash
        run: |
          rm -f .github/issue36_support_patch.py
          rm -f .github/issue36_test_support_patch.py
          rm -f .github/issue36-helper.gz
          rm -f .github/workflows/agent-issue36-apply-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize separate STEP-08 P/E review sheets (#36) [issue-36-applied]'
          git push origin HEAD:fix/issue-30-fresh-onboarding-root
