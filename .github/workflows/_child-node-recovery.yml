name: Temporary child-node recovery

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - tools/_apply_child_node_recovery_fix.py
      - .github/workflows/_child-node-recovery.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record PLAN before implementation and apply fix
        run: python tools/_apply_child_node_recovery_fix.py prepare
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate all ContextCanon output
        run: contextcanon build --all .
      - name: Verify zero generated drift
        run: contextcanon check --all .
      - name: Verify clean diff
        run: git diff --check
      - name: Finalize durable PLAN and STATE
        run: python tools/_apply_child_node_recovery_fix.py finalize
      - name: Remove temporary harness and commit clean result
        run: |
          rm tools/_apply_child_node_recovery_fix.py
          rm .github/workflows/_child-node-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Recover generated child Nodes during onboarding restart"
          git push origin HEAD:agent/onboarding-placement-publication
