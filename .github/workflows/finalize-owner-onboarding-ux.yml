name: finalize owner onboarding UX

on:
  push:
    branches:
      - agent/onboarding-inventory
    paths:
      - .github/workflows/finalize-owner-onboarding-ux.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-inventory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ContextCanon
        run: python -m pip install -e .

      - name: Close verified owner-walkthrough checkpoint in working tree
        shell: python
        run: |
          from pathlib import Path

          plan = Path("PLAN.md")
          text = plan.read_text(encoding="utf-8")
          old = "- [ ] Regenerate self-hosted Context outputs and pass the complete deterministic/build/check/diff gate on the exact review head."
          new = "- [x] Regenerate self-hosted Context outputs and pass the complete deterministic/build/check/diff gate on the exact review head."
          if old not in text:
              raise SystemExit("Expected open owner-walkthrough gate not found in PLAN.md")
          text = text.replace(old, new, 1)
          old_checkpoint = (
              "Checkpoint: Issues #55/#56 are implemented on draft PR #54 and the complete deterministic suite currently passes 279 tests. "
              "The remaining expected failure is self-hosted generated drift after the documentation/contract changes; regenerate and verify before returning the branch for the next owner walkthrough. "
              "PR #54 remains draft and must not be merged without explicit project-owner approval."
          )
          new_checkpoint = (
              "Checkpoint: Issues #55/#56 are implemented on draft PR #54. The owner-walkthrough correction head passes the complete deterministic suite "
              "(279 tests), self-hosted build/check with zero generated drift, and diff hygiene. The corrected STEP 01-03 first-contact flow is ready for the next "
              "Hello World Extended owner walkthrough. PR #54 remains draft and must not be merged without explicit project-owner approval."
          )
          if old_checkpoint not in text:
              raise SystemExit("Expected owner-walkthrough checkpoint text not found in PLAN.md")
          plan.write_text(text.replace(old_checkpoint, new_checkpoint, 1), encoding="utf-8")

          state = Path("STATE.md")
          text = state.read_text(encoding="utf-8")
          old = (
              "Draft PR #54 is the current unaccepted ContextCanon 0.9.0 candidate. Its first Hello World Extended owner walkthrough produced Issues #55/#56: "
              "installation now leads into `onboard init` and the generated PLAN, STEP 02 has a local inventory guide, opaque documents use explicit Markdown transcriptions, "
              "and ordinary source code is omitted from the default inventory. Full self-hosted regeneration/verification is still required before the next owner walkthrough."
          )
          new = (
              "Draft PR #54 is the current unaccepted ContextCanon 0.9.0 candidate. Its first Hello World Extended owner walkthrough produced Issues #55/#56: "
              "installation now leads into `onboard init` and the generated PLAN, STEP 02 has a local inventory guide, opaque documents use explicit Markdown transcriptions, "
              "and ordinary source code is omitted from the default inventory. The corrected candidate passes the complete deterministic suite (279 tests), self-hosted build/check "
              "with zero generated drift, and diff hygiene; it is ready for the next owner walkthrough but remains unaccepted product state."
          )
          if old not in text:
              raise SystemExit("Expected PR #54 verification sentence not found in STATE.md")
          state.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v

      - name: Regenerate self-hosted ContextCanon outputs
        run: contextcanon build --all .

      - name: Verify self-hosted outputs
        run: contextcanon check --all .

      - name: Verify diff hygiene
        run: git diff --check

      - name: Remove temporary finalizer and commit verified product tree
        run: |
          rm .github/workflows/finalize-owner-onboarding-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Finalize first-contact onboarding owner walkthrough (#55 #56)"
          git push origin HEAD:agent/onboarding-inventory
