name: docs generated outputs

on:
  push:
    branches:
      - agent/accepted-099-docs

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Build generated outputs
        run: contextcanon build --all .
      - name: Commit generated outputs
        shell: bash
        run: |
          git add CONTEXT.src.md CONTEXT.md CONTEXT/ .context/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Gateway package after docs refresh"
          git push
