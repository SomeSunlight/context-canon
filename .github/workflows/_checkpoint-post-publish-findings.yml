name: Checkpoint post-publish onboarding findings

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record post-publish findings
        run: python tools/_checkpoint_post_publish_findings.py
      - name: Hygiene
        run: git diff --check
      - name: Commit durable checkpoint and remove temporary harness
        shell: bash
        run: |
          rm -f .github/workflows/_checkpoint-post-publish-findings.yml tools/_checkpoint_post_publish_findings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record first production post-publish findings"
          git push origin HEAD:agent/onboarding-placement-publication
