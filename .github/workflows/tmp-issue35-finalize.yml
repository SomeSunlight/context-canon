name: temporary Issue 35 PLAN finalization

on:
  push:
    branches:
      - fix/issue-30-fresh-onboarding-root

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-30-fresh-onboarding-root
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize durable PLAN checkpoint
        run: python .github/tmp_issue35_finalize.py
      - name: Verify PLAN diff
        shell: bash
        run: git diff --check
      - name: Commit clean PLAN checkpoint
        shell: bash
        run: |
          git config user.name 'ContextCanon automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/tmp_issue35_finalize.py .github/workflows/tmp-issue35-finalize.yml
          git add PLAN.md
          git diff --cached --check
          git commit -m 'Checkpoint split STEP-08 owner-test fix (#35)'
          git push origin HEAD:fix/issue-30-fresh-onboarding-root
