name: finalize issues 21-24

on:
  push:
    branches:
      - agent/issues-14-15-multi-parent
    paths:
      - .github/workflows/finalize-issues-21-24.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ensure Issues 21-24 plan checkpoint exists
        run: |
          if ! grep -q '^## Active owner-test UX block: Issues #21–#24$' PLAN.md; then
            echo 'PLAN checkpoint missing; refuse to implement before planning.' >&2
            exit 1
          fi
      - name: Repair prepared builder mechanics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.contextcanon-issue-21-24-builder.py')
          text = path.read_text(encoding='utf-8')
          old = '    result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = '    result, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('sub_once replacement target not found')
          text = text.replace(old, new, 1)
          start = text.rfind("    r'''from __future__ import annotations")
          if start < 0:
              raise SystemExit('test block start delimiter not found')
          text = text[:start] + '    r"""from __future__ import annotations' + text[start + len("    r'''from __future__ import annotations"):]
          end_marker = "\n''',\n)\n\nprint(\"Issues #21-#24 product edits prepared\")"
          end = text.rfind(end_marker)
          if end < 0:
              raise SystemExit('test block end delimiter not found')
          replacement = '\n""",\n)\n\nprint("Issues #21-#24 product edits prepared")'
          text = text[:end] + replacement + text[end + len(end_marker):]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply prepared product edits
        run: python .contextcanon-issue-21-24-builder.py
      - name: Apply full-suite compatibility and audit corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          # Local/offline adoption still freezes a clean Git-backed package when Git provenance exists.
          path = Path('src/contextcanon/sources.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import shutil\nimport tempfile\n', 'import shutil\nimport subprocess\nimport tempfile\n', 1)
          marker = 'def adopt_source_package(node_root: Path, package_root: Path) -> tuple[CompiledPackage, bool]:\n'
          helper = '''def _validate_local_adoption_checkout(package_root: Path) -> None:\n    """Reject dirty Git-backed package bytes without requiring Git or a remote for pure local repositories."""\n    try:\n        repository_result = subprocess.run(\n            ["git", "-C", str(package_root), "rev-parse", "--show-toplevel"],\n            stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=False,\n        )\n    except (FileNotFoundError, OSError):\n        return\n    if repository_result.returncode != 0:\n        return\n    repository = Path(repository_result.stdout.strip()).resolve()\n    try:\n        node_path = package_root.resolve().relative_to(repository).as_posix() or "."\n    except ValueError as exc:\n        raise ContextCanonError(f"Source package root is not inside its Git repository: {package_root}") from exc\n    status = subprocess.run(\n        ["git", "-C", str(repository), "status", "--porcelain", "--untracked-files=all", "--", node_path],\n        stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=False,\n    )\n    if status.returncode != 0:\n        detail = status.stderr.strip() or status.stdout.strip() or f"exit code {status.returncode}"\n        raise ContextCanonError(f"Could not verify local Source package cleanliness: {detail}")\n    if status.stdout.strip():\n        raise ContextCanonError("Source package path has uncommitted changes; exact adoption bytes would be ambiguous")\n\n\n'''
          if marker not in text:
              raise SystemExit('adoption marker missing')
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '    package_root = package_root.resolve()\n    repo_root = find_repo_root(node_root)\n',
              '    package_root = package_root.resolve()\n    _validate_local_adoption_checkout(package_root)\n    repo_root = find_repo_root(node_root)\n',
              1,
          )
          text = text.replace(
              '    config_before = config.read_bytes() if config.is_file() else None\n    upsert_local_source(repo_root, candidate.metadata.id, package_root)\n    entry = _render_adopted_source(node_root, repo_root, candidate)\n',
              '    config_before = config.read_bytes() if config.is_file() else None\n    entry = _render_adopted_source(node_root, repo_root, candidate)\n',
              1,
          )
          text = text.replace(
              '    try:\n        _atomic_write_text(source_path, after)\n',
              '    try:\n        upsert_local_source(repo_root, candidate.metadata.id, package_root)\n        _atomic_write_text(source_path, after)\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Keep the exact candidate commit visible even though discovery settings are now central.
          path = Path('src/contextcanon/onboarding_placement_publish.py')
          text = path.read_text(encoding='utf-8')
          old = '                f"  - discovery: `{source.kind}` `{source.locator}`" + (f" @ `{source.discovery_ref}`" if source.discovery_ref else ""),\n                f"  - node-path: `{source.node_path}`",\n'
          new = '                f"  - discovery: `{source.kind}` `{source.locator}`" + (f" @ `{source.discovery_ref}`" if source.discovery_ref else ""),\n                f"  - exact candidate commit: `{source.ref}`" if source.kind == "git" and source.ref else "  - exact candidate: local immutable package bytes",\n                f"  - node-path: `{source.node_path}`",\n'
          if old not in text:
              raise SystemExit('preview discovery rendering target missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Match the documented repository-wide propagation spelling and skip already-current edges.
          path = Path('src/contextcanon/cli.py')
          text = path.read_text(encoding='utf-8')
          old = '    parent_propagate.add_argument("--yes", action="store_true", help="accept each displayed Parent diff without interactive confirmation")\n'
          new = '    parent_propagate.add_argument("--all", action="store_true", help="explicitly select all semantic Parent edges in the repository")\n    parent_propagate.add_argument("--yes", action="store_true", help="accept each displayed Parent diff without interactive confirmation")\n'
          if old not in text:
              raise SystemExit('parent propagate parser target missing')
          text = text.replace(old, new, 1)
          old = '                    result, receipt = review_parent_candidate(child_root, parent.id)\n                    print(render_diff(result), end="")\n                    if not args.yes and not _confirm(f"Accept this reviewed Parent update for {child.metadata.name}?"):\n'
          new = '                    result, receipt = review_parent_candidate(child_root, parent.id)\n                    print(render_diff(result), end="")\n                    if result.is_empty:\n                        print("Parent pin is already current; no acceptance needed.")\n                        continue\n                    if not args.yes and not _confirm(f"Accept this reviewed Parent update for {child.metadata.name}?"):\n'
          if old not in text:
              raise SystemExit('parent propagate review target missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Update adoption regression from obsolete inline transport metadata to central local discovery.
          path = Path('tests/test_source_adoption.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from contextcanon.compiler import Compiler\n', 'from contextcanon.compiler import Compiler\nfrom contextcanon.config import load_project_config\n', 1)
          old = '''        self.assertEqual(source.transport, "git")\n        self.assertEqual(source.transport_ref, head)\n        self.assertEqual(source.node_path, "nodes/library/python-development")\n        self.assertEqual(source.locator, "https://example.test/shared-context.git")\n'''
          new = '''        self.assertIsNone(source.transport)\n        self.assertIsNone(source.transport_ref)\n        self.assertIsNone(source.node_path)\n        self.assertEqual(source.locator, "contextcanon.yaml")\n        config = load_project_config(self.consumer)\n        source_config = config.sources["node-python"]\n        repository = config.repositories[source_config.repository]\n        self.assertEqual(repository.kind, "local")\n        self.assertEqual(repository.resolve_local(self.consumer), self.provider.resolve())\n        self.assertEqual(source_config.node_path, "nodes/library/python-development")\n'''
          if old not in text:
              raise SystemExit('source adoption legacy assertions missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Onboarding publication now records transport once in contextcanon.yaml, while acceptance keeps exact Git provenance.
          path = Path('tests/test_onboarding_placement_publish.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from contextcanon.compiler import Compiler\n', 'from contextcanon.compiler import Compiler\nfrom contextcanon.config import load_project_config\n', 1)
          old = '''        self.assertIn('transport="git"', root_text)\n        self.assertIn(f'ref="{head}"', root_text)\n'''
          new = '''        self.assertNotIn('transport="git"', root_text)\n        self.assertIn("(contextcanon.yaml)", root_text)\n        config = load_project_config(repo)\n        source_config = config.sources["c4c94726-3cc7-4df6-b779-72bbf9c06f40"]\n        repository = config.repositories[source_config.repository]\n        self.assertEqual(repository.kind, "git")\n        self.assertEqual(source_config.node_path, "catalog-workflow")\n        acceptance_payload = json.loads(acceptance.read_text(encoding="utf-8"))\n        self.assertEqual(acceptance_payload["sources"][0]["discovery"]["ref"], head)\n'''
          if old not in text:
              raise SystemExit('onboarding legacy transport assertions missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Python syntax gate
        run: python -m compileall -q src tests
      - name: Focused Issues 21-24 regressions
        run: |
          python -m unittest discover -s tests -p 'test_configuration_and_update_ux.py' -v
          python -m unittest tests.test_source_adoption tests.test_onboarding_placement_publish -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted Context
        run: contextcanon build --all .
      - name: Verify generated Context
        run: contextcanon check --all .
      - name: Remove temporary implementation helpers
        run: rm -f .contextcanon-issue-21-24-builder.py .github/workflows/finalize-issues-21-24.yml
      - name: Diff hygiene
        run: |
          git add -A
          git diff --cached --check
      - name: Commit clean product candidate
        run: |
          git commit -m "Implement human-scale Source updates and central config (#21 #22 #23 #24)"
          git push origin HEAD:agent/issues-14-15-multi-parent
