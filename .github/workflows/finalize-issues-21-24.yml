name: finalize issues 21-24

on:
  push:
    branches:
      - agent/issues-14-15-multi-parent
    paths:
      - .github/workflows/finalize-issues-21-24.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ensure Issues 21-24 plan checkpoint exists
        run: |
          if ! grep -q '^## Active owner-test UX block: Issues #21–#24$' PLAN.md; then
            python -c 'from pathlib import Path; p=Path("PLAN.md"); p.write_text(p.read_text(encoding="utf-8") + "\n\n## Active owner-test UX block: Issues #21–#24\n\nPurpose: turn the first real post-onboarding update into a human-scale workflow while preserving immutable acceptance and offline operation.\n\n- [ ] #21 expose the installed ContextCanon version through `contextcanon --version`.\n- [ ] #22 let humans discover Sources by name and propagate accepted Parent changes top-down without per-edge command archaeology or per-Node skip configuration.\n- [ ] #23 allow one-off Source candidate discovery from an explicit Git ref/branch/commit without rewriting accepted state.\n- [ ] #24 centralize operational repository/Source discovery in an extensible repository-root YAML configuration, including pure local/offline repositories, while keeping accepted immutable pins in each consumer Node.\n- [ ] Preserve compatibility with existing inline Git transport metadata and run focused regressions, the complete deterministic suite, self-build/check and diff hygiene before returning to owner testing.\n\nCheckpoint: the project owner approved this coherent Issues #21–#24 block during the real `ai-workstation` pre-merge test. Parent propagation must update every applicable edge top-down; project-specific differences belong in normal local Override/Remove semantics rather than propagation exclusions.\n", encoding="utf-8")'
            git add PLAN.md
            git commit -m "Plan owner-test update UX block (#21 #22 #23 #24)"
            git push origin HEAD:agent/issues-14-15-multi-parent
          fi
      - name: Repair prepared builder mechanics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.contextcanon-issue-21-24-builder.py')
          text = path.read_text(encoding='utf-8')
          old = '    result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = '    result, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('sub_once replacement target not found')
          text = text.replace(old, new, 1)
          start = text.rfind("    r'''from __future__ import annotations")
          if start < 0:
              raise SystemExit('test block start delimiter not found')
          text = text[:start] + '    r"""from __future__ import annotations' + text[start + len("    r'''from __future__ import annotations"):]
          end_marker = "\n''',\n)\n\nprint(\"Issues #21-#24 product edits prepared\")"
          end = text.rfind(end_marker)
          if end < 0:
              raise SystemExit('test block end delimiter not found')
          replacement = '\n""",\n)\n\nprint("Issues #21-#24 product edits prepared")'
          text = text[:end] + replacement + text[end + len(end_marker):]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply prepared product edits
        run: python .contextcanon-issue-21-24-builder.py
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused Issues 21-24 regressions
        run: python -m unittest discover -s tests -p 'test_configuration_and_update_ux.py' -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate self-hosted Context
        run: contextcanon build --all .
      - name: Verify generated Context
        run: contextcanon check --all .
      - name: Remove temporary implementation helpers
        run: rm -f .contextcanon-issue-21-24-builder.py .github/workflows/finalize-issues-21-24.yml
      - name: Diff hygiene
        run: |
          git add -A
          git diff --cached --check
      - name: Commit clean product candidate
        run: |
          git commit -m "Implement human-scale Source updates and central config (#21 #22 #23 #24)"
          git push origin HEAD:agent/issues-14-15-multi-parent
