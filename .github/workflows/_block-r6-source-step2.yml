name: Implement R6 Source update step 2

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply R6 step 2
        run: |
          python tools/_fix_r6_step2_helper.py
          python tools/_block_r6_source_step2.py
          python -m compileall -q src tests
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused exact Source review and accept tests
        run: |
          python -m unittest tests.test_git_transport tests.test_source_acceptance tests.test_external_sources tests.test_package tests.test_diff -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify self-hosted context
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Checkpoint R6 step 2 and commit clean product tree
        run: |
          python tools/_block_r6_source_step2.py --complete
          rm -f .github/workflows/_block-r6-source-step2.yml tools/_block_r6_source_step2.py tools/_fix_r6_step2_helper.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind Source updates to reviewed Git candidates"
          git push origin HEAD:agent/onboarding-placement-publication
