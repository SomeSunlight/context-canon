name: Temporary reset recovery checkpoint

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
          fetch-depth: 0

      - name: Checkpoint reset recovery truth
        run: |
          python - <<'PY'
          from pathlib import Path

          plan_path = Path("PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old = """- [ ] Make reset recreate the default (or explicitly selected) ContextCanon-owned onboarding workspace when it is missing, while retaining the existing refusal to take over a foreign directory.\n- [ ] Ensure the recreated PLAN is immediately rewritten to the requested reset checkpoint and contains the exact snapshot-bound commands for restarting at that numbered step.\n- [ ] Add regression coverage for a completely missing workspace, then run the normal PR verification on the resulting head before handing the owner a new install SHA.\n"""
          new = """- [x] Make reset recreate the default (or explicitly selected) ContextCanon-owned onboarding workspace when it is missing, while retaining the existing refusal to take over a foreign directory.\n- [x] Ensure the recreated PLAN is immediately rewritten to the requested reset checkpoint and contains the exact snapshot-bound commands for restarting at that numbered step.\n- [x] Add regression coverage for a completely missing workspace, then run the normal PR verification on the resulting head before handing the owner a new install SHA.\n\nReset operator-surface recovery checkpoint: the live owner test exposed the missing-workspace case after `reset --from 2`. Reset now recreates/refreshes the ContextCanon-owned workspace, rewrites the reset checkpoint, and repopulates the exact snapshot-bound command console. Regression coverage raises the deterministic suite to 142 tests. PR workflow #482 / run `33498482979` passed the product fix with unit/repository consistency and generated-output verification green. This checkpoint records that proof before one final exact-head PR run.\n"""
          if old not in plan:
              raise SystemExit("PLAN Block G checklist did not match expected text")
          plan_path.write_text(plan.replace(old, new, 1), encoding="utf-8")

          state_path = Path("STATE.md")
          state = state_path.read_text(encoding="utf-8")
          marker = "Opening/resetting an older owned workspace refreshes its framework-owned PLAN to the current runbook rather than leaving stale step numbers behind."
          replacement = marker + "\n\nIf the visible workspace has been deleted entirely, reset now recreates the ContextCanon-owned workspace as well. The recreated `PLAN.md` is immediately bound to the preserved Evidence snapshot, marks the requested restart checkpoint, and contains the concrete restart/reset commands instead of an empty command placeholder. A foreign existing directory is still never taken over."
          if marker not in state:
              raise SystemExit("STATE reset paragraph did not match expected text")
          state = state.replace(marker, replacement, 1)
          state = state.replace("The owner-testing hardening candidate has **141 deterministic tests**", "The owner-testing hardening candidate now has **142 deterministic tests**", 1)
          state = state.replace("all 141 tests", "all 142 tests", 1)
          state = state.replace(
              "## Boundaries that intentionally remain",
              "## Latest reset recovery verification\n\nThe missing-workspace reset correction is covered by a direct regression test and passed ordinary PR workflow #482 / run `33498482979`. The final repository-authored checkpoint must retain the same product behavior, zero generated drift, and no temporary finalizer files before the owner reinstalls for the next `ai-workstation` run.\n\n## Boundaries that intentionally remain",
              1,
          )
          state_path.write_text(state, encoding="utf-8")
          PY

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v

      - name: Regenerate all ContextCanon output
        run: PYTHONPATH=src python -m contextcanon build --all .

      - name: Verify zero generated drift
        run: PYTHONPATH=src python -m contextcanon check --all .

      - name: Verify clean diff
        run: git diff --check

      - name: Commit clean checkpoint
        run: |
          rm -f .github/workflows/_finalize-reset-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Checkpoint reset operator recovery"
          git push origin HEAD:agent/onboarding-placement-publication
