name: Checkpoint owner Source migration gap

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record deferred owner Source migration defect
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('PLAN.md'); marker='Block Q — legacy owner-Source migration gap'; block=base64.b64decode('').decode(); text=p.read_text(encoding='utf-8'); p.write_text(text if marker in text else text.rstrip()+'\n\n'+block, encoding='utf-8')"
      - name: Focused hygiene check
        run: git diff --check
      - name: Remove temporary workflow and commit checkpoint
        shell: bash
        run: |
          rm -f .github/workflows/_checkpoint-owner-source-migration-gap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md .github/workflows/_checkpoint-owner-source-migration-gap.yml
          git diff --cached --check
          git commit -m "Record deferred owner Source migration gap"
          git push origin HEAD:agent/onboarding-placement-publication
