name: Normalize Block R plan

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize Block R
        run: python tools/_normalize_block_r_plan.py
      - name: Verify and commit clean PLAN-only product change
        run: |
          git diff --check
          rm -f .github/workflows/_normalize-block-r-plan.yml tools/_normalize_block_r_plan.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Simplify Block R execution plan"
          git push origin HEAD:agent/onboarding-placement-publication
