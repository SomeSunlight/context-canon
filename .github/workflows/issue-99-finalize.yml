name: issue-99-finalize

on:
  push:
    branches:
      - issue-99-parent-reference-phase1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-99-parent-reference-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Run deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Refresh root self-host package
        run: contextcanon build .
      - name: Verify repository health
        run: contextcanon check --all .
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit deterministic final self-host state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No self-host refresh changes to commit."
            exit 0
          fi
          git commit -m "build: refresh final Parent Reference state (#99)"
          git push origin HEAD:issue-99-parent-reference-phase1
