name: issue-101 self-host refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'issue-101-markdown-link-encoding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-101-markdown-link-encoding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stop after the refresh commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq "Refresh self-hosted Context for #101"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh self-hosted Context
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          contextcanon build nodes/library/development-workflow
          python - <<'PY'
          from pathlib import Path
          import re

          provider = Path("nodes/library/development-workflow/CONTEXT.src.md").read_text(encoding="utf-8")
          match = re.search(r'ctx:node\\s+[^>]*version="([^"]+)"', provider)
          if match is None:
              raise SystemExit("Development Workflow version not found")
          version = match.group(1)

          source_line = re.compile(
              r'(- \\[Development Workflow\\]\\([^\\n]+\\) — `)[^\\`]+(` — `relationship=parent`)'
          )
          source_comment = re.compile(
              r'(ctx:source\\s+id="c4c94726-3cc7-4df6-b779-72bbf9c06f40"\\s+version=")[^"]+(")'
          )
          for raw in (
              "nodes/internal/framework-development/CONTEXT.src.md",
              "nodes/library/github/CONTEXT.src.md",
              "nodes/library/github-local/CONTEXT.src.md",
          ):
              path = Path(raw)
              text = path.read_text(encoding="utf-8")
              text, visible_count = source_line.subn(rf'\\g<1>{version}\\g<2>', text, count=1)
              text, comment_count = source_comment.subn(rf'\\g<1>{version}\\g<2>', text, count=1)
              if visible_count != 1 or comment_count != 1:
                  raise SystemExit(f"{raw}: Development Workflow import was not updated exactly once")
              path.write_text(text, encoding="utf-8")
              print(f"{raw}: Development Workflow Parent advanced to {version}")
          PY
          contextcanon build nodes/internal/framework-development
          contextcanon build nodes/library/github
          contextcanon build nodes/library/github-local
          contextcanon build .
          python -m unittest discover -s tests -v
          contextcanon check --all .
          git diff --check
      - name: Commit refreshed packages
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh self-hosted Context for #101"
          git push origin HEAD:issue-101-markdown-link-encoding
