name: Apply issue 27 Source story

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issues-14-15-multi-parent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python .github/scripts/patch_issue27_source_story_applicator.py
      - run: python .github/scripts/apply_issue27_source_story.py
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: contextcanon build --all .
      - run: python -m unittest discover -s tests -v
      - run: contextcanon check --all .
      - run: git diff --check
      - run: |
          rm .github/scripts/patch_issue27_source_story_applicator.py
          rm .github/scripts/apply_issue27_source_story.py
          rm .github/workflows/apply-issue27-source-story.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SomeSunlight@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make Source update review read like a local change story"
          git push origin HEAD:agent/issues-14-15-multi-parent
