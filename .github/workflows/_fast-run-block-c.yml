name: fast-run-block-c

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - .github/workflows/_fast-run-block-c.yml

permissions:
  contents: write

jobs:
  block-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - name: Apply Block C
        run: python tools/_fast_run_block_c.py
      - name: Repair fixed-authority fixture
        run: python tools/_repair_block_c_fixture.py
      - name: Run focused tests
        id: tests
        shell: bash
        run: |
          printf 'Block C diagnostic for %s\n' "$GITHUB_SHA" > block-c-diagnostic.txt
          set +e
          python -m unittest \
            tests.test_onboarding_structure \
            tests.test_onboarding_placement \
            tests.test_onboarding_placement_review \
            tests.test_onboarding_placement_publish >> block-c-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat block-c-diagnostic.txt
          exit 0
      - name: Commit diagnostic on failure
        if: steps.tests.outputs.exit_code != '0'
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add block-c-diagnostic.txt
          git commit -m "Record Block C test diagnostic"
          git push origin HEAD:agent/onboarding-placement-publication
      - name: Remove temporary helpers
        if: steps.tests.outputs.exit_code == '0'
        run: rm -f tools/_fast_run_block_c.py tools/_repair_block_c_fixture.py block-c-diagnostic.txt .github/workflows/_fast-run-block-c.yml
      - name: Commit Block C
        if: steps.tests.outputs.exit_code == '0'
        run: |
          git config user.name "ContextCanon fast-run"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git add -A
          git commit -m "Complete reviewed placement publication flow"
          git push origin HEAD:agent/onboarding-placement-publication
