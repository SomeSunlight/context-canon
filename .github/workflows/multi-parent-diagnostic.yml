name: multi-parent diagnostic

on:
  push:
    branches:
      - agent/issues-14-15-multi-parent

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find single-parent assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          needles = (
              '.parent', 'parent_package', 'ctx:parent', 'ParentRef', 'parent_key',
              'parent-candidate', 'parent review', 'parent accept', 'parent_pin',
              'Parent Context Node', 'semantic Parent', 'one Parent',
              'multiple conceptual parents',
          )
          roots = [Path('src'), Path('tests'), Path('nodes'), Path('docs')]
          files = [Path('README.md'), Path('CONTRIBUTING.md'), Path('CONTEXT.src.md')]
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.suffix in {'.py', '.md'})
          for path in sorted(set(files)):
              if not path.is_file():
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(lines, 1):
                  if any(needle.lower() in line.lower() for needle in needles):
                      print(f'{path}:{number}:{line}')
          PY
