name: Add explicit reusable Source first adoption

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Block S step 3
        run: |
          python tools/_block_s_machine_state_step3.py
          python -m compileall -q src tests
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused Source adoption and update regressions
        run: |
          python -m unittest tests.test_source_adoption tests.test_git_transport tests.test_source_acceptance tests.test_external_sources tests.test_ai_workstation_parent_migration -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify self-hosted context
        run: |
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Checkpoint Block S step 3 and commit clean product tree
        run: |
          python tools/_block_s_machine_state_step3.py --complete
          rm -f .github/workflows/_block-s-machine-state-step3.yml tools/_block_s_machine_state_step3.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add explicit reusable Source first adoption"
          git push origin HEAD:agent/onboarding-placement-publication
