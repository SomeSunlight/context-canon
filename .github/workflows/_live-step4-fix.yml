name: Temporary live Step-4 fix

on:
  push:
    branches:
      - agent/onboarding-placement-publication
    paths:
      - tools/_apply_live_step4_fix.py
      - .github/workflows/_live-step4-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Apply live owner-test fix
        run: python tools/_apply_live_step4_fix.py
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate all ContextCanon output
        run: contextcanon build --all .
      - name: Verify zero generated drift
        run: contextcanon check --all .
      - name: Verify clean diff
        run: git diff --check
      - name: Commit clean product result
        run: |
          rm tools/_apply_live_step4_fix.py
          rm .github/workflows/_live-step4-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix structure preview recovery and runbook aliases"
          git push origin HEAD:agent/onboarding-placement-publication
