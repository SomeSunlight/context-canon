name: cleanup-accidental-branches

on:
  push:
    branches: [agent/onboarding-placement-publication]
    paths: [.github/workflows/_cleanup-accidental-branches.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-placement-publication
      - name: Delete accidental helper refs
        run: |
          git push origin --delete \
            agent/onboarding-placement-publication-ci \
            agent/onboarding-placement-publication-ci2 \
            agent/onboarding-placement-publication-draft \
            agent/onboarding-placement-publication-final \
            agent/onboarding-placement-publication-pr \
            agent/onboarding-placement-publication-review
      - name: Remove this helper
        run: |
          git config user.name "ContextCanon cleanup"
          git config user.email "43569752+SomeSunlight@users.noreply.github.com"
          git rm .github/workflows/_cleanup-accidental-branches.yml
          git commit -m "Remove accidental branch cleanup helper"
          git push origin HEAD:agent/onboarding-placement-publication
