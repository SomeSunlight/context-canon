name: temp-resource-list-refresh

on:
  push:
    branches:
      - agent/resource-identity-v2
    paths:
      - .github/workflows/temp-resource-list-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Rebuild self-hosted Context
        run: contextcanon build --all .
      - name: Run deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Verify zero generated drift
        run: contextcanon check --all .
      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate Resource list documentation Context"
            git push
          fi
