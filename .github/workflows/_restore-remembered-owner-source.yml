name: Temporary remembered owner Source recovery fix

on:
  push:
    branches:
      - agent/onboarding-placement-publication

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply owner Source recovery correction
        run: python tools/_restore_remembered_owner_source.py apply
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Focused regression
        run: python -m unittest tests.test_onboarding_reset.OnboardingResetTests.test_remembered_owner_source_is_reused_only_when_review_is_created -v
      - name: Complete deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Regenerate ContextCanon outputs
        run: contextcanon build --all .
      - name: Verify generated output
        run: contextcanon check --all .
      - name: Verify implementation diff
        run: git diff --check
      - name: Finalize durable checkpoint
        run: python tools/_restore_remembered_owner_source.py finalize
      - name: Rebuild and recheck after checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('PLAN.md', 'STATE.md'):
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          contextcanon build --all .
          contextcanon check --all .
          git diff --check
      - name: Remove temporary harness and commit clean product result
        run: |
          rm -f tools/_restore_remembered_owner_source.py .github/workflows/_restore-remembered-owner-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reuse remembered owner Source in placement review"
          git push origin HEAD:agent/onboarding-placement-publication
