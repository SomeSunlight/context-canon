name: temp-fast-track-refresh

on:
  push:
    branches:
      - agent/fast-track-terminology
    paths:
      - .github/workflows/temp-fast-track-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ContextCanon
        run: python -m pip install -e .
      - name: Regenerate Context packages
        run: contextcanon build --all .
      - name: Run deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Verify zero generated drift
        run: contextcanon check --all .
      - name: Verify old terminology is gone
        shell: bash
        run: |
          if git grep -n -i 'fast[-]run'; then
            echo "Old accelerated-mode terminology remains."
            exit 1
          fi
      - name: Commit regenerated Context
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate Context for Fast Track terminology"
            git push
          fi
