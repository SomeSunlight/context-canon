name: Finalize issue 27

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/issues-14-15-multi-parent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-14-15-multi-parent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python .github/scripts/patch_finalize_issue27.py
      - run: python .github/scripts/finalize_issue27.py
      - run: python -m compileall -q src tests
      - run: contextcanon build --all .
      - run: python -m unittest discover -s tests -v
      - run: contextcanon check --all .
      - run: git diff --check
      - run: |
          rm .github/scripts/patch_finalize_issue27.py
          rm .github/scripts/finalize_issue27.py
          rm .github/workflows/finalize-issue27.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish human-scale maintenance and propagation UX"
          git push origin HEAD:agent/issues-14-15-multi-parent
